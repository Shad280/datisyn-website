<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140" role="img" aria-label="Datisyn wordmark">
  <defs>
    <linearGradient id="gw" x1="0" x2="1">
      <stop offset="0%" stop-color="#2AB3FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
  </defs>

  <rect width="600" height="140" fill="transparent" />

  <g transform="translate(40,96)">
    <style>
      .brand { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-weight:800; font-size:64px; }
      .tag { font-family: Inter, sans-serif; font-size:14px; fill:#6b7280 }
    </style>

    <!-- Wordmark with gradient on first letter -->
    <text x="0" y="0" class="brand">
      <tspan fill="url(#gw)">D</tspan>
      <tspan x="48" fill="#0B2545">atisyn</tspan>
    </text>

    <!-- optional tagline (comment out in usage if unused) -->
    <text x="0" y="28" class="tag">Transform Data Into Decisions</text>
  </g>

</svg>