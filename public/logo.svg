<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" role="img" aria-label="Datisyn logo">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#2AB3FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Icon: stylized 'D' shape made of an arc and three connected nodes -->
  <g transform="translate(24,16)">
    <!-- outer arc -->
    <path d="M0 44 C0 20 20 0 44 0 L64 0" fill="none" stroke="url(#g1)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)"/>

    <!-- inner connecting line -->
    <path d="M60 8 L110 44 L60 80" fill="none" stroke="#9AD8FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- nodes -->
    <circle cx="110" cy="44" r="8" fill="#2AB3FF"/>
    <circle cx="76" cy="28" r="6" fill="#FFD166"/>
    <circle cx="76" cy="60" r="6" fill="#7AE582"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(160,72)">
    <style>
      .word { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; font-weight: 600; font-size: 40px; letter-spacing: 0.5px; }
    </style>
    <text class="word" x="0" y="0" fill="#0B2545">Datisyn</text>
  </g>

</svg>