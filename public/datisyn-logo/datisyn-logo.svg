<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
>
  <!-- DATISYN Logo – Concept C -->

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" fill="#031424" />

  <!-- Logo Mark -->
  <g id="mark" transform="translate(256 190)">
    <rect x="-110" y="-110" width="220" height="220" rx="36" ry="36"
          fill="none" stroke="#00B3FF" stroke-width="10" transform="rotate(45)"/>
    <rect x="-82" y="-82" width="164" height="164" rx="28" ry="28"
          fill="none" stroke="#29C3FF" stroke-width="9" transform="rotate(45)"/>
    <rect x="-54" y="-54" width="108" height="108" rx="20" ry="20"
          fill="none" stroke="#63D7FF" stroke-width="8" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="10" fill="#00B3FF"/>
  </g>

  <!-- Wordmark -->
  <g id="wordmark" transform="translate(256 360)">
    <text x="0" y="0" text-anchor="middle" fill="#E8F5FF"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="64" font-weight="700" letter-spacing="6">
      DATISYN
    </text>
  </g>
</svg>
